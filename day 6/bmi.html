<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>
    <link rel="stylesheet" href="bmi.css">
</head>
<body>
    <div class="container">
        <h1>BMI Calculator</h1>
        <p class="subtitle">Calculate your Body Mass Index</p>
        <!-- Gender -->
        <div class="form-group">
            <label>Gender</label>
            <div class="gender-options">
                <label class="gender-box">
                    <input type="radio" name="gender" value="Male">
                    <span>♂ Male</span>
                </label>
                <label class="gender-box">
                    <input type="radio" name="gender" value="Female">
                    <span>♀ Female</span>
                </label>
            </div>
        </div>

        <!-- Age -->
        <div class="form-group">
            <label for="age">Age</label>
            <input
                type="number"
                id="age"
                placeholder="Enter your age"
                min="1"
                max="120"
                step="1"
            
        </div>

        <!-- Height -->
        <div class="form-group">
            <label for="height">Height</label>
            <div class="input-with-unit">
                <input
                    type="number"
                    id="height"
                    placeholder="Enter your height"
                    min="1"
                    step="0.1"
                >
                <span>cm</span>
            </div>
        </div>

        <!-- Weight -->
        <div class="form-group">
            <label for="weight">Weight</label>
            <div class="input-with-unit">
                <input
                    type="number"
                    id="weight"
                    placeholder="Enter your weight"
                    min="1"
                    step="0.1"
                >
                <span>kg</span>
            </div>
        </div>

        <!-- Buttons -->
        <div class="buttons">
            <button id="calculateBtn" class="calculate-btn">
                Calculate
            </button>
            <button id="clearBtn" class="clear-btn">
                Clear
            </button>
        </div>

        <!-- Result -->
        <div id="result" class="result">
            <h2>BMI Report</h2>
            <p>
                Gender:
                <span id="resultGender">-</span>
            </p>
            <p>
                Age:
                <span id="resultAge">-</span>
            </p>
            <p>
                Height:
                <span id="resultHeight">-</span>
            </p>
            <p>
                Weight:
                <span id="resultWeight">-</span>
            </p>
            <div class="bmi-value">
                BMI = <span id="bmiValue">-</span>
            </div>
            <div class="category">
                <span id="bmiCategory">-</span>
            </div>
        </div>
    </div>

    <script src="bmi.js"></script>

</body>
</html>
