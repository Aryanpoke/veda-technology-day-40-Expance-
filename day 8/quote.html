<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Quote Generator</title>
    <link rel="stylesheet" href="quote.css">
</head>
<body>
    <div class="container">
        <div class="quote-box">
            <h1>Random Quote Generator</h1>
            <p class="subtitle">
                Get inspired with a random quote
            </p>
            <div class="quote-content">
                <div class="quote-icon">“</div>
                <p id="quote">
                    Click the button below to generate a quote.
                </p>
                <p id="author">
                    — Unknown
                </p>
            </div>
            <div class="buttons">
                <button id="newQuoteBtn">
                    New Quote
                </button>
                <button id="copyBtn">
                    Copy Quote
                </button>
                <button id="shareBtn">
                    Share Quote
                </button>
            </div>
        </div>
        <footer>
            <p>Built with HTML, CSS & JavaScript</p>
        </footer>
    </div>
    <script src="quote.js"></script>
</body>
</html>
