<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Interactive star rating widget built using HTML, CSS and JavaScript.">
    <title>Star Rating Widget</title>
    <link rel="stylesheet" href="rateing.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <span class="track-title">
            HI ARYAN — WEB DEVELOPMENT TRACK
        </span>
        <h1>Star Rating Widget</h1>
        <p class="subtitle">
            Rate your experience by selecting from 1 to 5 stars.
        </p>

        <!-- Rating Box -->
        <div class="rating-card">
            <h2>How would you rate this?</h2>
            <!-- Stars -->
            <div class="stars" id="stars">
                <button class="star" data-value="1" aria-label="1 star">
                    ★
                </button>
                <button class="star" data-value="2" aria-label="2 stars">
                    ★
                </button>
                <button class="star" data-value="3" aria-label="3 stars">
                    ★
                </button>
                <button class="star" data-value="4" aria-label="4 stars">
                    ★
                </button>
                <button class="star" data-value="5" aria-label="5 stars">
                    ★
                </button>
            </div>
            <!-- Rating Display -->
            <div class="rating-result">
                <span id="ratingNumber">0</span>
                <span>/ 5</span>
            </div>
            <p id="ratingText">
                No rating selected
            </p>
        </div>
        <!-- Reset Button -->
        <button id="resetBtn" class="reset-btn">
            Reset Rating
        </button>
        <!-- Footer -->
        <footer>
            <p>
                Interactive UI using HTML, CSS & JavaScript
            </p>
        </footer>
    </div>
    <script src="rateing.js"></script>
</body>
</html>
