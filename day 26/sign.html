<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A responsive signup form with JavaScript validation.">
    <title>Signup Form with Validation</title>
    <link rel="stylesheet" href="sign.css">
    <script src="sign.js" defer></script>
</head>
<body>

    <main class="signup-container">
        <div class="form-header">
            <div class="logo">A</div>
            <h1>Create Account</h1>
            <p>Join us today! Enter your details below.</p>
        </div>

        <form id="signupForm" novalidate>
            <div class="form-group">
                <label for="name">Full Name</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    autocomplete="name"
                    aria-describedby="nameError"
                    required
                >
                <small class="error" id="nameError"></small>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    aria-describedby="emailError"
                    required
                >
                <small class="error" id="emailError"></small>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-wrapper">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a strong password"
                        autocomplete="new-password"
                        aria-describedby="passwordError strengthText"
                        required
                    >
                    <button
                        type="button"
                        id="togglePassword"
                        class="toggle-password"
                        aria-label="Show password"
                    >Show</button>
                </div>

                <div class="strength-track">
                    <div id="strengthBar" class="strength-bar"></div>
                </div>
                <small id="strengthText" class="strength-text">
                    Password strength
                </small>
                <small class="error" id="passwordError"></small>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    placeholder="Re-enter your password"
                    autocomplete="new-password"
                    aria-describedby="confirmError"
                    required
                >
                <small class="error" id="confirmError"></small>
            </div>

            <button type="submit" class="submit-btn">
                Create Account
            </button>

            <p id="successMessage" class="success-message"
               role="status" aria-live="polite"></p>
        </form>

        <p class="footer-text">
            Already have an account? <a href="#login">Sign in</a>
        </p>
    </main>

</body>
</html>
