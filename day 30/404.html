<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="404 Error Page - The page you are looking for could not be found.">
    <title>404 - Page Not Found</title>
    <link rel="stylesheet" href="404.css">
</head>
<body>

    <main class="error-page">
        <div class="error-card">

            <div class="illustration" aria-hidden="true">
                <div class="orbit orbit-one"></div>
                <div class="orbit orbit-two"></div>

                <div class="planet">
                    <div class="crater crater-one"></div>
                    <div class="crater crater-two"></div>
                    <div class="crater crater-three"></div>
                </div>

                <span class="star star-one">✦</span>
                <span class="star star-two">✧</span>
                <span class="star star-three">✦</span>
                <span class="number number-four-left">4</span>
                <span class="number number-four-right">4</span>
            </div>

            <p class="error-label">
                <span class="status-dot"></span>
                ERROR 404
            </p>

            <h1>Oops! Page not found</h1>

            <p class="description">
                Looks like this page has gone on an adventure.
                Don't worry, let's get you back on track.
            </p>

            <div class="actions">
                <a href="index.html" class="home-button">
                    <span aria-hidden="true">←</span>
                    Back to Homepage
                </a>
                <button class="back-button" onclick="history.back()">
                    Go Back
                </button>
            </div>

            <p class="help-text">
                If you think something is broken, please try again later.
            </p>

        </div>

        <footer>
            <span class="footer-mark">404</span>
            <span>Lost in space? We'll help you find your way.</span>
        </footer>
    </main>

</body>
</html>
