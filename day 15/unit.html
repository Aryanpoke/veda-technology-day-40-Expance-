<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="A responsive unit converter for length and weight units using HTML, CSS and JavaScript.">
    <title>Unit Converter</title>
    <link rel="stylesheet" href="unit.css">
</head>
<body>
    <div class="container">
        <div class="converter-box">
            <h1>Unit Converter</h1>
            <p class="subtitle">
                Convert length and weight units quickly and easily
            </p>
            <!-- Category -->
            <div class="form-group">
                <label for="category">Conversion Type</label>
                <select id="category">
                    <option value="length">Length</option>
                    <option value="weight">Weight</option>
                </select>
            </div>
            <!-- Input -->
            <div class="form-group">
                <label for="inputValue">Enter Value</label>
                <input
                    type="number"
                    id="inputValue"
                    placeholder="Enter a value"
                    step="any"
                >
            </div>
            <!-- Units -->
            <div class="unit-row">
                <div class="form-group">
                    <label for="fromUnit">From</label>
                    <select id="fromUnit"></select>
                </div>
                <div class="arrow">
                    →
                </div>
                <div class="form-group">
                    <label for="toUnit">To</label>
                    <select id="toUnit"></select>
                </div>
            </div>
            <!-- Result -->
            <div class="result-box">
                <span>Converted Result</span>
                <h2 id="result">
                    0
                </h2>
                <p id="resultText">
                    Enter a value to start conversion
                </p>
            </div>
            <button id="clearBtn">
                Clear
            </button>
        </div>
    </div>
    <script src="unit.js"></script>
</body>
</html>
