<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="A random password generator built using HTML, CSS and JavaScript.">
    <title>Random Password Generator</title>
    <link rel="stylesheet" href="password.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>Random Password Generator</h1>
            <p>Create a strong and secure password instantly</p>
        </div>
        <!-- Password Display -->
        <div class="password-box">
            <input
                type="text"
                id="password"
                placeholder="Your password will appear here"
                readonly
            >
            <button id="copyBtn" title="Copy Password">
                📋
            </button>
        </div>
        <!-- Length Section -->
        <div class="length-section">
            <div class="option-title">
                <label for="length">Password Length</label>
                <span id="lengthValue">12</span>
            </div>
            <input
                type="range"
                id="length"
                min="4"
                max="32"
                value="12"
            >
        </div>
        <!-- Character Options -->
        <div class="options">
            <h2>Character Types</h2>
            <label class="check-option">
                <input type="checkbox" id="uppercase" checked>
                <span>Uppercase Letters</span>
                <small>A-Z</small>
            </label
            <label class="check-option">
                <input type="checkbox" id="lowercase" checked>
                <span>Lowercase Letters</span>
                <small>a-z</small>
            </label>
            <label class="check-option">
                <input type="checkbox" id="numbers" checked>
                <span>Numbers</span>
                <small>0-9</small>
            </label>
            <label class="check-option">
                <input type="checkbox" id="symbols" checked>
                <span>Symbols</span>
                <small>!@#$%</small>
            </label>
        </div>
        <!-- Generate Button -->
        <button id="generateBtn" class="generate-btn">
            🔐 Generate Password
        </button>
        <!-- Message -->
        <p id="message" class="message"></p>
    </div>
    <script src="password.js"></script>
</body>
</html>
