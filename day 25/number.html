<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Game</title>
    <link rel="stylesheet" href="number.css">
</head>
<body>
    <main class="game-container">
        <div class="game-icon">🎯</div>
        <h1>Number Guessing Game</h1>
        <p class="subtitle">Can you guess the secret number?</p>

        <div class="range-info">
            Guess a number between <strong>1 and 100</strong>
        </div>

        <form id="guessForm">
            <label for="guessInput">Enter your guess</label>
            <input
                type="number"
                id="guessInput"
                min="1"
                max="100"
                placeholder="e.g. 42"
                required
            >
            <button type="submit" id="guessButton">
                Check My Guess
            </button>
        </form>

        <p id="message" role="status" aria-live="polite">
            Good luck! Make your first guess.
        </p>

        <div class="stats">
            <div class="stat-card">
                <span class="stat-label">Attempts</span>
                <strong id="attempts">0</strong>
            </div>
            <div class="stat-card">
                <span class="stat-label">Remaining</span>
                <strong id="remaining">10</strong>
            </div>
        </div>

        <button id="playAgain" class="restart-button" hidden>
            🔄 Play Again
        </button>

        <p class="footer">Made with HTML, CSS & JavaScript</p>
    </main>

    <script src="number.js"></script>
</body>
</html>
