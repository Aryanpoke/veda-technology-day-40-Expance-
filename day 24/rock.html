<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Play Rock Paper Scissors against the computer.">
    <title>Rock Paper Scissors Game</title>
    <link rel="stylesheet" href="rock.css">
</head>
<body>

    <main class="game-container">
        <header>
            <span class="tag">MINI PROJECT</span>
            <h1>Rock Paper Scissors</h1>
            <p class="subtitle">Choose your move. Beat the computer!</p>
        </header>

        <section class="scoreboard">
            <div class="score-card">
                <span>You</span>
                <h2 id="playerScore">0</h2>
            </div>
            <div class="score-card">
                <span>Draws</span>
                <h2 id="drawScore">0</h2>
            </div>
            <div class="score-card">
                <span>Computer</span>
                <h2 id="computerScore">0</h2>
            </div>
        </section>

        <section class="battle">
            <div class="choice-box">
                <span class="choice-label">YOUR MOVE</span>
                <div class="choice-icon" id="playerChoice">❔</div>
                <p id="playerLabel">Waiting...</p>
            </div>

            <div class="versus">VS</div>

            <div class="choice-box">
                <span class="choice-label">COMPUTER</span>
                <div class="choice-icon" id="computerChoice">🤖</div>
                <p id="computerLabel">Waiting...</p>
            </div>
        </section>

        <section class="result-box" aria-live="polite">
            <h2 id="result">Ready to play?</h2>
            <p id="message">Select your move below to start.</p>
        </section>

        <section class="choices">
            <button class="choice-btn" data-choice="rock" aria-label="Choose rock">
                <span>✊</span>
                <small>Rock</small>
            </button>

            <button class="choice-btn" data-choice="paper" aria-label="Choose paper">
                <span>✋</span>
                <small>Paper</small>
            </button>

            <button class="choice-btn" data-choice="scissors" aria-label="Choose scissors">
                <span>✌️</span>
                <small>Scissors</small>
            </button>
        </section>

        <button id="resetBtn" class="reset-btn">↻ Reset Score</button>

        <footer>
            Built with HTML, CSS & JavaScript
        </footer>
    </main>

    <script src="rock.js"></script>
</body>
</html>
